services:
  - type: web
    name: hussein-pos
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hussein-pos-db
          property: connectionString

databases:
  - name: hussein-pos-db
    databaseName: hussein_pos
    plan: free
